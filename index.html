<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HORT TRANS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
body { background: #0A192F; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 70px; }
.card { background: linear-gradient(145deg, #112240, #0A192F); border: 1px solid #1E3A8A; border-radius: 16px; }
.btn { background: linear-gradient(90deg, #FFD700, #FFA500); color: #0A192F; font-weight: bold; border: none; cursor: pointer; }
.btn:active { transform: scale(.96); }
.btn-blue { background: linear-gradient(90deg, #00BFFF, #0057B7); color: #fff; font-weight: bold; border: none; cursor: pointer; }
.bottom-nav { background: #112240; border-top: 1px solid #1E3A8A; position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
.nav-item { color: #8892B0; display: flex; flex-direction: column; align-items: center; font-size: 11px; flex: 1; cursor: pointer; }
.nav-item.active { color: #FFD700; }
.nav-item i { font-size: 18px; margin-bottom: 2px; }
.page { display: none; } .page.active { display: block; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal-box { background: #112240; width: 95%; max-width: 400px; border-radius: 20px; padding: 20px; border: 1px solid #1E3A8A; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #FFD700, #00BFFF); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0A192F; font-size: 18px; }
input { background: #0A192F !important; border: 1px solid #1E3A8A !important; color: #fff !important; border-radius: 10px; padding: 12px; width: 100%; outline: none; }

/* СТИЛІ ДЛЯ ІГОР */
.playing-card { width: 50px; height: 75px; background: #fff; border-radius: 6px; color: #000; display: inline-flex; flex-direction: column; justify-content: space-between; padding: 4px; font-weight: bold; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); margin: 2px; }
.playing-card.red { color: #d32f2f; }
.playing-card.back { background: repeating-linear-gradient(45deg, #1E3A8A, #1E3A8A 5px, #0A192F 5px, #0A192F 10px); border: 2px solid #fff; }
.card-container { display: flex; flex-wrap: wrap; justify-content: center; min-height: 80px; }

.slot-reel { font-size: 40px; background: #fff; border-radius: 10px; width: 60px; height: 80px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
.dice-box { width: 60px; height: 60px; background: #fff; color: #000; font-size: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: bold; box-shadow: 0 4px 0 #ccc; }
.mines-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 250px; margin: 0 auto; }
.mine-cell { background: #1E3A8A; height: 60px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border: 1px solid #00BFFF; }
.mine-cell.bomb { background: #d32f2f; }
.mine-cell.gem { background: #4CAF50; }

@keyframes spin { 100% { transform: rotate(360deg); } }
.spin-anim { animation: spin 0.5s linear; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.shake-anim { animation: shake 0.3s; }
</style>
</head>
<body class="p-4">

<div id="game-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="flex justify-between items-center mb-4">
      <h3 id="game-title" class="text-xl font-bold text-yellow-400"></h3>
      <button onclick="closeGame()" class="text-gray-400 text-2xl bg-transparent border-0"><i class="fas fa-times"></i></button>
    </div>
    <div id="game-body"></div>
    <div id="game-result" class="mt-4 text-center font-bold text-lg min-h-[30px] text-yellow-400"></div>
  </div>
</div>

<div id="page-home" class="page active">
  <h1 class="text-2xl font-bold text-center mb-3 text-yellow-400">Мій Профіль</h1>
  <div class="card p-5 mb-3">
    <div class="flex items-center gap-3 mb-4">
      <div class="avatar" id="my-avatar">D</div>
      <div class="flex-1 min-w-0">
        <p class="font-bold truncate" id="my-name">Driver</p>
        <p class="text-xs text-gray-400 truncate" id="my-nick">TruckBook: —</p>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div class="bg-blue-900/40 p-3 rounded-lg border border-blue-700"><p class="text-xs text-gray-400">Баланс</p><p class="text-xl font-bold text-yellow-400" id="my-coins">0 HC</p></div>
      <div class="bg-blue-900/40 p-3 rounded-lg border border-blue-700"><p class="text-xs text-gray-400">Тижневий</p><p class="text-lg font-bold text-green-400" id="my-weekly">0</p></div>
    </div>
  </div>
</div>

<div id="page-games" class="page">
  <h1 class="text-2xl font-bold text-center mb-3 text-yellow-400">Ігри</h1>
  <div class="grid grid-cols-2 gap-3 text-center">
    <div class="card p-3" onclick="openGame('casino')"><div class="text-3xl mb-1">🎰</div><p class="text-sm font-bold">Слоти</p></div>
    <div class="card p-3" onclick="openGame('blackjack')"><div class="text-3xl mb-1">🃏</div><p class="text-sm font-bold">Блекджек</p></div>
    <div class="card p-3" onclick="openGame('durak')"><div class="text-3xl mb-1">🃏</div><p class="text-sm font-bold">Дурень</p></div>
    <div class="card p-3" onclick="openGame('dice')"><div class="text-3xl mb-1">🎲</div><p class="text-sm font-bold">Кістки</p></div>
    <div class="card p-3" onclick="openGame('thimbles')"><div class="text-3xl mb-1">🥛</div><p class="text-sm font-bold">Наперстки</p></div>
    <div class="card p-3" onclick="openGame('wheel')"><div class="text-3xl mb-1">🛞</div><p class="text-sm font-bold">Колесо</p></div>
    <div class="card p-3" onclick="openGame('roulette')"><div class="text-3xl mb-1">🎡</div><p class="text-sm font-bold">Рулетка</p></div>
    <div class="card p-3" onclick="openGame('mines')"><div class="text-3xl mb-1">💣</div><p class="text-sm font-bold">Мінне поле</p></div>
    <div class="card p-3" onclick="openGame('double')"><div class="text-3xl mb-1">🪙</div><p class="text-sm font-bold">Монетка</p></div>
    <div class="card p-3" onclick="openGame('rps')"><div class="text-3xl mb-1">✊</div><p class="text-sm font-bold">РПС</p></div>
    <div class="card p-3" onclick="openGame('russian')"><div class="text-3xl mb-1">🔫</div><p class="text-sm font-bold">Російська</p></div>
    <div class="card p-3" onclick="openGame('smuggler')"><div class="text-3xl mb-1">🚚</div><p class="text-sm font-bold">Контрабанда</p></div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="switchPage('home',this)"><i class="fas fa-home"></i><span>Головна</span></div>
  <div class="nav-item" onclick="switchPage('games',this)"><i class="fas fa-gamepad"></i><span>Ігри</span></div>
</div>

<script>
const API = "https://ваш-воркер.workers.dev/api"; // ВАШЕ ПОСИЛАННЯ CLOUDFLARE
let MY_ID = localStorage.getItem("hort_uid");
let currentGame = null, gameState = null;

function switchPage(id, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  el.classList.add('active');
}

async function loadHome() {
  if (!MY_ID) return;
  try {
    const p = await (await fetch(`${API}/profile/${MY_ID}`)).json();
    document.getElementById('my-avatar').textContent = (p.nickname[0] || 'D').toUpperCase();
    document.getElementById('my-name').textContent = p.discord_name;
    document.getElementById('my-nick').textContent = 'TruckBook: ' + p.nickname;
    document.getElementById('my-coins').textContent = p.coins.toLocaleString() + ' HC';
  } catch(e) {}
}

// ================= ВІЗУАЛЬНІ ЕЛЕМЕНТИ =================
function cardHtml(c, hidden=false) {
    if (hidden || c.rank === '?') return `<div class="playing-card back"></div>`;
    const red = c.suit === '♥' || c.suit === '♦';
    return `<div class="playing-card ${red?'red':''}"><span>${c.rank}<br>${c.suit}</span></div>`;
}
const diceEmojis = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

// ================= ІГРИ =================
const gamesConfig = {
  casino: { title: "🎰 Слоти", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><button onclick="playGame()" class="btn w-full py-3 rounded-xl">Крутити</button>` },
  blackjack: { title: "🃏 Блекджек", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><button onclick="playGame('start')" class="btn w-full py-3 rounded-xl">Роздати карти</button>` },
  durak: { title: "🃏 Дурень", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><button onclick="playGame('start')" class="btn w-full py-3 rounded-xl">Почати гру</button>` },
  dice: { title: "🎲 Кістки", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><div class="flex gap-2"><button onclick="playGame('>7')" class="btn flex-1 py-2 rounded-lg">Більше 7</button><button onclick="playGame('=7')" class="btn flex-1 py-2 rounded-lg">Рівно 7</button><button onclick="playGame('<7')" class="btn flex-1 py-2 rounded-lg">Менше 7</button></div>` },
  thimbles: { title: "🥛 Наперстки", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><div class="flex gap-2"><button onclick="playGame(1)" class="btn flex-1 py-2 rounded-lg">1</button><button onclick="playGame(2)" class="btn flex-1 py-2 rounded-lg">2</button><button onclick="playGame(3)" class="btn flex-1 py-2 rounded-lg">3</button></div>` },
  wheel: { title: "🛞 Колесо", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><button onclick="playGame()" class="btn w-full py-3 rounded-xl">Крутити</button>` },
  roulette: { title: "🎡 Рулетка", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><input type="number" id="g-num" placeholder="Число (1-13)" class="mb-3"><div class="flex gap-2"><button onclick="playGame('red')" class="btn flex-1 py-2 rounded-lg text-red-700">Червоне</button><button onclick="playGame('black')" class="btn flex-1 py-2 rounded-lg bg-gray-800 text-white">Чорне</button><button onclick="playGame('number')" class="btn flex-1 py-2 rounded-lg">Число</button></div>` },
  mines: { title: "💣 Мінне поле", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><p class="text-sm mb-2">Оберіть клітинку (1-9)</p><button onclick="playGame()" class="btn w-full py-3 rounded-xl">Грати</button>` },
  double: { title: "🪙 Монетка", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><div class="flex gap-2"><button onclick="playGame('heads')" class="btn flex-1 py-2 rounded-lg">Орел</button><button onclick="playGame('tails')" class="btn flex-1 py-2 rounded-lg">Решка</button></div>` },
  rps: { title: "✊ РПС", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><div class="flex gap-2"><button onclick="playGame('rock')" class="btn flex-1 py-2 rounded-lg">✊</button><button onclick="playGame('scissors')" class="btn flex-1 py-2 rounded-lg">✌️</button><button onclick="playGame('paper')" class="btn flex-1 py-2 rounded-lg">✋</button></div>` },
  russian: { title: "🔫 Російська", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><button onclick="playGame()" class="btn w-full py-3 rounded-xl">Крутити барабан</button>` },
  smuggler: { title: "🚚 Контрабанда", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><div class="flex gap-2"><button onclick="playGame('safe')" class="btn flex-1 py-2 rounded-lg">Безпечно (x1.5)</button><button onclick="playGame('risky')" class="btn flex-1 py-2 rounded-lg">Ризик (x3)</button></div>` },
};

function openGame(name) {
  currentGame = name; gameState = null;
  document.getElementById('game-modal').classList.add('show');
  document.getElementById('game-result').innerHTML = '';
  document.getElementById('game-title').textContent = gamesConfig[name].title;
  document.getElementById('game-body').innerHTML = gamesConfig[name].action();
}

async function playGame(action = null, index = 0) {
  const betEl = document.getElementById('g-bet');
  const bet = betEl ? parseInt(betEl.value) : 0;
  const numEl = document.getElementById('g-num');
  const payload = { user_id: parseInt(MY_ID), bet: bet, action: action, game_data: { ...gameState, card_idx: index } };
  if (numEl) payload.game_data.num = parseInt(numEl.value);

  try {
    const r = await fetch(`${API}/game/${currentGame}`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail);
    gameState = { ...gameState, ...d };
    renderGame();
    loadHome();
  } catch(e) { document.getElementById('game-result').innerHTML = `<span class="text-red-500">${e.message}</span>`; }
}

function renderGame() {
  const body = document.getElementById('game-body');
  const res = document.getElementById('game-result');
  res.innerHTML = '';

  if (currentGame === 'casino') {
    body.innerHTML = `<div class="flex justify-center gap-2 mb-4">${gameState.reels.map(r => `<div class="slot-reel">${r}</div>`).join('')}</div><button onclick="playGame()" class="btn w-full py-3 rounded-xl">Крутити ще</button>`;
    res.innerHTML = gameState.win > 0 ? `🎉 Виграш: +${gameState.win} HC` : `📉 Програш: -${gameState.bet} HC`;
  }
  else if (currentGame === 'dice') {
    body.innerHTML = `<div class="flex justify-center gap-4 mb-4"><div class="dice-box">${diceEmojis[gameState.d1]}</div><div class="dice-box">${diceEmojis[gameState.d2]}</div></div><button onclick="openGame('dice')" class="btn w-full py-3 rounded-xl">Грати знову</button>`;
    res.innerHTML = gameState.win > 0 ? `🎉 Випало ${gameState.total}! +${gameState.win} HC` : `📉 Випало ${gameState.total}. -${gameState.bet} HC`;
  }
  else if (currentGame === 'blackjack') {
    body.innerHTML = `<div class="mb-3 text-center"><p class="text-gray-400">Дилер (${gameState.d_score})</p><div class="card-container">${gameState.d_hand.map(c => cardHtml(c, c.rank === '?')).join('')}</div></div>
    <div class="mb-3 text-center"><p class="text-gray-400">Ви (${gameState.p_score})</p><div class="card-container">${gameState.p_hand.map(c => cardHtml(c)).join('')}</div></div>
    <div class="flex gap-2">${gameState.status === 'playing' ? `<button onclick="playGame('hit')" class="btn-blue flex-1 py-3 rounded-xl">Взяти</button><button onclick="playGame('stand')" class="btn flex-1 py-3 rounded-xl">Стоп</button>` : `<button onclick="openGame('blackjack')" class="btn w-full py-3 rounded-xl">Грати знову</button>`}</div>`;
    if (gameState.result) res.innerHTML = gameState.result;
  }
  else if (currentGame === 'durak') {
    body.innerHTML = `<div class="text-sm text-center mb-2 text-gray-400">Козир: ${gameState.trump} | Колода: ${gameState.deck_count}</div>
    <div class="text-center mb-4"><p class="text-sm">Бот (${gameState.d_hand_count})</p><div class="card-container">${Array(gameState.d_hand_count).fill('<div class="playing-card back"></div>').join('')}</div></div>
    <div class="bg-green-900/30 border border-green-700 rounded-xl p-4 min-h-[100px] flex items-center justify-center mb-4"><div class="card-container">${gameState.table.map(c => cardHtml(c)).join('') || 'Стіл порожній'}</div></div>
    <div class="text-center"><p class="text-sm">Ваші карти</p><div class="card-container">${gameState.p_hand.map((c, i) => `<div onclick="playGame('attack', ${i})">${cardHtml(c)}</div>`).join('')}</div></div>`;
    if (gameState.result) res.innerHTML = gameState.result;
  }
  else if (currentGame === 'mines') {
    body.innerHTML = `<div class="mines-grid mb-4">${[0,1,2,3,4,5,6,7,8].map(i => {
        let cls = "mine-cell";
        let content = "";
        if (gameState.chosen == i) { content = gameState.win > 0 ? "💎" : "💥"; cls += gameState.win > 0 ? " gem" : " bomb"; }
        else if (gameState.bombs.includes(i)) { content = "💥"; }
        return `<div class="${cls}">${content}</div>`;
    }).join('')}</div><button onclick="openGame('mines')" class="btn w-full py-3 rounded-xl">Грати знову</button>`;
    res.innerHTML = gameState.win > 0 ? `💎 Скарб! +${gameState.win} HC` : `💥 Міна! -${gameState.bet} HC`;
  }
  else if (currentGame === 'rps') {
    const em = {rock: "✊", scissors: "✌️", paper: "✋"};
    body.innerHTML = `<div class="flex justify-around items-center mb-4 text-6xl"><div>${em[gameState.user_choice]}</div><div class="text-xl text-gray-500">vs</div><div>${em[gameState.bot_choice]}</div></div><button onclick="openGame('rps')" class="btn w-full py-3 rounded-xl">Грати знову</button>`;
    res.innerHTML = gameState.win > gameState.bet ? `🎉 Ви виграли +${gameState.bet} HC` : (gameState.win === gameState.bet ? `🤝 Нічия` : `📉 Ви програли -${gameState.bet} HC`);
  }
  else if (currentGame === 'double') {
    body.innerHTML = `<div class="text-8xl text-center mb-4">${gameState.side === 'heads' ? '👑' : '🦅'}</div><button onclick="openGame('double')" class="btn w-full py-3 rounded-xl">Грати знову</button>`;
    res.innerHTML = gameState.win > 0 ? `🎉 Ви вгадали! +${gameState.bet} HC` : `📉 Не вгадали! -${gameState.bet} HC`;
  }
  else if (currentGame === 'thimbles') {
    body.innerHTML = `<div class="flex justify-around items-center mb-4 text-6xl">${[1,2,3].map(i => `<div>${gameState.win_cup === i ? "🏆" : "🥛"}</div>`).join('')}</div><button onclick="openGame('thimbles')" class="btn w-full py-3 rounded-xl">Грати знову</button>`;
    res.innerHTML = gameState.win > 0 ? `🎯 Ви вгадали наперсток! +${gameState.bet} HC` : `📉 Мимо! Кулька була під ${gameState.win_cup}-м`;
  }
  else if (currentGame === 'roulette') {
    body.innerHTML = `<div class="text-8xl text-center mb-4 font-bold ${gameState.color === 'red' ? 'text-red-500' : (gameState.color === 'black' ? 'text-gray-900 bg-white rounded-full' : 'text-green-500')}">${gameState.number}</div><button onclick="openGame('roulette')" class="btn w-full py-3 rounded-xl">Грати знову</button>`;
    res.innerHTML = gameState.win > 0 ? `🎉 Ви вгадали! +${gameState.win} HC` : `📉 Не вгадали! -${gameState.bet} HC`;
  }
  else if (currentGame === 'russian') {
    body.innerHTML = `<div class="text-8xl text-center mb-4 ${gameState.bullet ? 'shake-anim' : ''}">${gameState.bullet ? '💥' : '🔫'}</div><button onclick="openGame('russian')" class="btn w-full py-3 rounded-xl">Грати знову</button>`;
    res.innerHTML = gameState.win > 0 ? `😮‍💨 Клац! Пощастило! +${gameState.win} HC` : `💀 Бах! Ви програли -${gameState.bet} HC`;
  }
  else if (currentGame === 'wheel' || currentGame === 'smuggler') {
    body.innerHTML = `<div class="text-6xl text-center mb-4">${gameState.win > 0 ? '✅' : '❌'}</div><button onclick="openGame('${currentGame}')" class="btn w-full py-3 rounded-xl">Грати знову</button>`;
    res.innerHTML = gameState.win > 0 ? `🎉 Успіх! +${gameState.win} HC` : `📉 Невдача! -${gameState.bet} HC`;
  }
}

function closeGame() { document.getElementById('game-modal').classList.remove('show'); loadHome(); }
if (MY_ID) loadHome();
</script>
</body>
</html>

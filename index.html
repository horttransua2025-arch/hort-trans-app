<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HORT TRANS</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
body { background: #0A192F; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 70px; }
.card { background: linear-gradient(145deg, #112240, #0A192F); border: 1px solid #1E3A8A; border-radius: 16px; }
.btn { background: linear-gradient(90deg, #FFD700, #FFA500); color: #0A192F; font-weight: bold; border: none; cursor: pointer; }
.btn:active { transform: scale(.96); }
.btn-blue { background: linear-gradient(90deg, #00BFFF, #0057B7); color: #fff; font-weight: bold; border: none; cursor: pointer; }
.btn-red { background: linear-gradient(90deg, #ff4b4b, #cc0000); color: #fff; font-weight: bold; border: none; cursor: pointer; }
.bottom-nav { background: #112240; border-top: 1px solid #1E3A8A; position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
.nav-item { color: #8892B0; display: flex; flex-direction: column; align-items: center; font-size: 11px; flex: 1; cursor: pointer; }
.nav-item.active { color: #FFD700; }
.nav-item i { font-size: 18px; margin-bottom: 2px; }
.page { display: none; } .page.active { display: block; animation: fadeIn .3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to {opacity:1; transform:translateY(0);} }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; z-index: 200; align-items: flex-end; }
.modal-overlay.show { display: flex; }
.modal-box { background: #112240; width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px; border-top: 2px solid #00BFFF; }
input, select { background: #0A192F !important; border: 1px solid #1E3A8A !important; color: #fff !important; border-radius: 10px; padding: 12px; width: 100%; outline: none; }

/* АВАТАРКИ */
.avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #FFD700; background: #1E3A8A; }

/* КАРТИ ТА ІГРИ */
.playing-card { width: 50px; height: 75px; background: #fff; border-radius: 6px; color: #000; display: inline-flex; flex-direction: column; justify-content: space-between; padding: 4px; font-weight: bold; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); margin: 2px; cursor: pointer; transition: transform 0.2s; }
.playing-card:hover { transform: translateY(-5px); }
.playing-card.red { color: #d32f2f; }
.playing-card.back { background: repeating-linear-gradient(45deg, #1E3A8A, #1E3A8A 5px, #0A192F 5px, #0A192F 10px); border: 2px solid #fff; cursor: default; }
.card-container { display: flex; flex-wrap: wrap; justify-content: center; min-height: 80px; }
.slot-reel { font-size: 40px; background: #fff; color: black; border-radius: 10px; width: 60px; height: 80px; display: flex; align-items: center; justify-content: center; }
.mines-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 250px; margin: 0 auto; }
.mine-cell { background: #1E3A8A; height: 60px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border: 1px solid #00BFFF; }
.mine-cell.bomb { background: #d32f2f; } .mine-cell.gem { background: #4CAF50; }
</style>
</head>
<body class="p-4">

<!-- АВТОРИЗАЦІЯ -->
<div id="auth-modal" class="modal-overlay show">
  <div class="modal-box text-center">
    <h2 class="text-xl font-bold text-yellow-400 mb-2">HORT TRANS</h2>
    <input type="text" id="auth-input" placeholder="Ваш нік TruckBook" class="mb-3" autocomplete="off">
    <button onclick="login()" class="btn w-full py-3 rounded-xl">Увійти</button>
    <div id="auth-error" class="mt-3 text-sm text-red-500"></div>
  </div>
</div>

<!-- МОДАЛЬНЕ ВІКНО ГРИ -->
<div id="game-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="flex justify-between items-center mb-4">
      <h3 id="game-title" class="text-xl font-bold text-yellow-400"></h3>
      <button onclick="closeGame()" class="text-gray-400 text-2xl bg-transparent border-0"><i class="fas fa-times"></i></button>
    </div>
    <div id="game-body"></div>
    <div id="game-result" class="mt-4 text-center font-bold text-lg min-h-[30px] text-yellow-400"></div>
  </div>
</div>

<!-- ГОЛОВНА -->
<div id="page-home" class="page active">
  <h1 class="text-2xl font-bold text-center mb-3 text-yellow-400">Мій Профіль</h1>
  <div class="card p-5 mb-3">
    <div class="flex items-center gap-3 mb-4">
      <img id="my-avatar" class="avatar" src="">
      <div class="flex-1 min-w-0">
        <p class="font-bold truncate" id="my-name">Driver</p>
        <p class="text-xs text-gray-400 truncate" id="my-nick">TruckBook: —</p>
      </div>
      <button onclick="logout()" class="text-gray-500 text-xs px-2 py-1 border border-gray-700 rounded bg-transparent">Змінити</button>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div class="bg-blue-900/40 p-3 rounded-lg border border-blue-700"><p class="text-xs text-gray-400">Баланс</p><p class="text-xl font-bold text-yellow-400" id="my-coins">0 HC</p></div>
      <div class="bg-blue-900/40 p-3 rounded-lg border border-blue-700"><p class="text-xs text-gray-400">Тижневий</p><p class="text-lg font-bold text-green-400" id="my-weekly">0</p></div>
    </div>
  </div>
</div>

<!-- ВОДІЇ -->
<div id="page-drivers" class="page">
  <h1 class="text-2xl font-bold text-center mb-3 text-yellow-400">Водії компанії</h1>
  <input type="text" id="search-driver" placeholder="🔍 Пошук..." oninput="filterDrivers()" class="mb-3">
  <div id="drivers-list"></div>
</div>

<!-- ІГРИ -->
<div id="page-games" class="page">
  <h1 class="text-2xl font-bold text-center mb-3 text-yellow-400">Ігри</h1>
  <div class="grid grid-cols-2 gap-3 text-center">
    <div class="card p-3" onclick="openGame('durak')"><div class="text-3xl mb-1">🃏</div><p class="text-sm font-bold">Дурень</p></div>
    <div class="card p-3" onclick="openGame('blackjack')"><div class="text-3xl mb-1">♠️</div><p class="text-sm font-bold">Блекджек</p></div>
    <div class="card p-3" onclick="openGame('casino')"><div class="text-3xl mb-1">🎰</div><p class="text-sm font-bold">Слоти</p></div>
    <div class="card p-3" onclick="openGame('dice')"><div class="text-3xl mb-1">🎲</div><p class="text-sm font-bold">Кістки</p></div>
    <div class="card p-3" onclick="openGame('mines')"><div class="text-3xl mb-1">💣</div><p class="text-sm font-bold">Мінне поле</p></div>
    <div class="card p-3" onclick="openGame('rps')"><div class="text-3xl mb-1">✊</div><p class="text-sm font-bold">РПС</p></div>
  </div>
</div>

<!-- БАНК -->
<div id="page-bank" class="page">
  <h1 class="text-2xl font-bold text-center mb-3 text-yellow-400">Банк</h1>
  <div class="card p-5">
    <input type="text" id="tr-recv" placeholder="Discord ID отримувача" class="mb-2">
    <input type="number" id="tr-amt" placeholder="Сума HC" class="mb-3">
    <button onclick="doTransfer()" class="btn w-full py-3 rounded-xl">Відправити</button>
    <div id="tr-result" class="mt-3 text-center text-sm font-bold text-green-400"></div>
  </div>
</div>

<!-- МЕНЮ -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchPage('home',this)"><i class="fas fa-home"></i><span>Головна</span></div>
  <div class="nav-item" onclick="switchPage('drivers',this)"><i class="fas fa-users"></i><span>Водії</span></div>
  <div class="nav-item" onclick="switchPage('games',this)"><i class="fas fa-gamepad"></i><span>Ігри</span></div>
  <div class="nav-item" onclick="switchPage('bank',this)"><i class="fas fa-university"></i><span>Банк</span></div>
</div>

<script>
const API = "https://ваш-воркер.workers.dev/api"; 
let MY_ID = localStorage.getItem("hort_uid");
let allDrivers = [], currentGame = null, gameState = null;

async function login() {
  const v = document.getElementById('auth-input').value.trim();
  const r = await fetch(`${API}/login`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ nick: v }) });
  const d = await r.json();
  if (r.ok) { MY_ID = String(d.user_id); localStorage.setItem('hort_uid', MY_ID); document.getElementById('auth-modal').classList.remove('show'); loadHome(); }
  else { document.getElementById('auth-error').textContent = d.detail; }
}
function logout() { localStorage.removeItem('hort_uid'); location.reload(); }
function switchPage(id, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active'); el.classList.add('active');
  if (id === 'home') loadHome(); if (id === 'drivers') loadDrivers();
}

async function loadHome() {
  if (!MY_ID) return;
  const p = await (await fetch(`${API}/profile/${MY_ID}`)).json();
  document.getElementById('my-avatar').src = p.avatar;
  document.getElementById('my-name').textContent = p.discord_name;
  document.getElementById('my-nick').textContent = 'TruckBook: ' + p.nickname;
  document.getElementById('my-coins').textContent = p.coins.toLocaleString() + ' HC';
}

async function loadDrivers() {
  allDrivers = await (await fetch(`${API}/drivers`)).json(); renderDrivers(allDrivers);
}
function filterDrivers() { renderDrivers(allDrivers.filter(d => d.name.toLowerCase().includes(document.getElementById('search-driver').value.toLowerCase()))); }
function renderDrivers(list) {
  document.getElementById('drivers-list').innerHTML = list.map(d => `
    <div class="card p-3 mb-2 flex items-center gap-3">
      <img src="${d.avatar}" class="avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
      <div class="flex-1 min-w-0"><p class="font-bold truncate">${d.name}</p><p class="text-xs text-gray-400">${d.distance.toLocaleString()} км</p></div>
      <div class="text-right"><p class="text-yellow-400 font-bold">${d.coins.toLocaleString()}</p></div>
    </div>`).join('');
}

async function doTransfer() {
  const res = document.getElementById('tr-result');
  const r = await fetch(`${API}/transfer`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ sender_id: parseInt(MY_ID), receiver_id: parseInt(document.getElementById('tr-recv').value), amount: parseInt(document.getElementById('tr-amt').value) }) });
  const d = await r.json();
  res.innerHTML = r.ok ? `<span class="text-green-400">${d.message}</span>` : `<span class="text-red-500">${d.detail}</span>`;
  loadHome();
}

function cardHtml(c, hidden=false) {
    if (hidden || c.rank === '?') return `<div class="playing-card back"></div>`;
    const red = c.suit === '♥' || c.suit === '♦';
    return `<div class="playing-card ${red?'red':''}"><span>${c.rank}<br>${c.suit}</span></div>`;
}

const gamesConfig = {
  durak: { title: "🃏 Дурень", action: () => `
    <input type="number" id="g-bet" placeholder="Ставка HC" value="50" class="mb-3">
    <select id="d-bots" class="mb-3"><option value="1">1 Суперник</option><option value="2">2 Суперники</option><option value="3">3 Суперники</option></select>
    <select id="d-rule" class="mb-3"><option value="podkidnoy">Підкидний</option><option value="perevodnoy">Переводний</option></select>
    <button onclick="playGame('start')" class="btn w-full py-3 rounded-xl">Почати</button>
  `},
  blackjack: { title: "♠️ Блекджек", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><button onclick="playGame('start')" class="btn w-full py-3 rounded-xl">Роздати</button>` },
  casino: { title: "🎰 Слоти", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><button onclick="playGame()" class="btn w-full py-3 rounded-xl">Крутити</button>` },
  dice: { title: "🎲 Кістки", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><div class="flex gap-2"><button onclick="playGame('>7')" class="btn flex-1 py-2">Більше 7</button><button onclick="playGame('=7')" class="btn flex-1 py-2">Рівно 7</button><button onclick="playGame('<7')" class="btn flex-1 py-2">Менше 7</button></div>` },
  mines: { title: "💣 Мінне поле", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><button onclick="playGame()" class="btn w-full py-3 rounded-xl">Грати</button>` },
  rps: { title: "✊ РПС", action: () => `<input type="number" id="g-bet" placeholder="Ставка" value="50" class="mb-3"><div class="flex gap-2"><button onclick="playGame('rock')" class="btn flex-1 py-2">✊</button><button onclick="playGame('scissors')" class="btn flex-1 py-2">✌️</button><button onclick="playGame('paper')" class="btn flex-1 py-2">✋</button></div>` }
};

function openGame(name) {
  currentGame = name; gameState = null; document.getElementById('game-modal').classList.add('show');
  document.getElementById('game-result').innerHTML = ''; document.getElementById('game-title').textContent = gamesConfig[name].title;
  document.getElementById('game-body').innerHTML = gamesConfig[name].action();
}

async function playGame(action = null, index = 0) {
  const betEl = document.getElementById('g-bet'); const bet = betEl ? parseInt(betEl.value) : 0;
  const payload = { user_id: parseInt(MY_ID), bet: bet, action: action, game_data: { ...gameState, card_idx: index } };
  
  if (currentGame === 'durak' && action === 'start') {
      payload.game_data.bots_count = parseInt(document.getElementById('d-bots').value);
      payload.game_data.rule = document.getElementById('d-rule').value;
  }

  try {
    const r = await fetch(`${API}/game/${currentGame}`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.detail || d.error);
    gameState = { ...gameState, ...d }; renderGame(); loadHome();
  } catch(e) { document.getElementById('game-result').innerHTML = `<span class="text-red-500">${e.message}</span>`; }
}

function renderGame() {
  const body = document.getElementById('game-body'); const res = document.getElementById('game-result'); res.innerHTML = '';
  
  if (currentGame === 'durak' && gameState.status === 'playing') {
      let botHtml = gameState.bots.map((b, i) => `<div class="text-center mb-1"><p class="text-xs text-gray-400">Бот ${i+1} (${b.hand.length})</p><div>${b.hand.map(() => '<div class="playing-card back" style="width:20px;height:30px"></div>').join('')}</div></div>`).join('');
      let tableHtml = gameState.table.map((t, idx) => `<div class="flex gap-1 ${gameState.turn === 'player_defend' && idx === gameState.table.length-1 ? 'border-2 border-red-500 rounded p-1' : ''}">${cardHtml(t.attack)}${t.defend ? cardHtml(t.defend) : '<div class="playing-card border border-dashed border-gray-500 bg-transparent"></div>'}</div>`).join('');
      
      let myCards = gameState.p_hand.map((c, i) => `<div onclick="${gameState.turn === 'player' ? `playGame('player_attack', ${i})` : `playGame('player_defend', ${i})`}">${cardHtml(c)}</div>`).join('');

      body.innerHTML = `
          <div class="text-sm text-center text-yellow-400 mb-2">Козир: ${gameState.trump} | Колода: ${gameState.deck_count}</div>
          <div class="mb-2">${botHtml}</div>
          <div class="bg-green-900/30 border border-green-700 rounded-xl p-4 min-h-[100px] flex flex-wrap gap-2 mb-4">${tableHtml || 'Стіл порожній'}</div>
          <div class="text-center"><p class="text-sm text-gray-400 mb-1">Ваші карти (натисніть)</p><div class="card-container">${myCards}</div></div>
          <div class="flex gap-2 mt-4">
            ${gameState.turn === 'player' ? `<button onclick="playGame('end_turn')" class="btn-blue w-full py-2 rounded-xl">Бито</button>` : ''}
            ${gameState.turn === 'player_defend' ? `<button onclick="playGame('player_take')" class="btn-red w-full py-2 rounded-xl">Забрати карти</button>` : ''}
          </div>
      `;
  }
  else if (currentGame === 'blackjack') {
    body.innerHTML = `<div class="mb-3 text-center"><p class="text-gray-400">Дилер (${gameState.d_score})</p><div class="card-container">${gameState.d_hand.map(c => cardHtml(c, c.rank === '?')).join('')}</div></div>
    <div class="mb-3 text-center"><p class="text-gray-400">Ви (${gameState.p_score})</p><div class="card-container">${gameState.p_hand.map(c => cardHtml(c)).join('')}</div></div>
    <div class="flex gap-2">${gameState.status === 'playing' ? `<button onclick="playGame('hit')" class="btn-blue flex-1 py-2">Взяти</button><button onclick="playGame('stand')" class="btn flex-1 py-2">Стоп</button>` : `<button onclick="openGame('blackjack')" class="btn w-full py-2">Грати знову</button>`}</div>`;
    if (gameState.result) res.innerHTML = gameState.result;
  }
  else if (currentGame === 'casino') {
    body.innerHTML = `<div class="flex justify-center gap-2 mb-4">${gameState.reels.map(r => `<div class="slot-reel">${r}</div>`).join('')}</div><button onclick="playGame()" class="btn w-full py-2">Крутити</button>`;
    res.innerHTML = gameState.win > 0 ? `🎉 +${gameState.win} HC` : `📉 -${gameState.bet} HC`;
  }
  else if (currentGame === 'dice') {
    body.innerHTML = `<div class="flex justify-center gap-4 mb-4 text-6xl"><div class="bg-white text-black p-4 rounded-xl">${gameState.d1}</div><div class="bg-white text-black p-4 rounded-xl">${gameState.d2}</div></div><button onclick="openGame('dice')" class="btn w-full py-2">Грати знову</button>`;
    res.innerHTML = gameState.win > 0 ? `🎉 +${gameState.win} HC` : `📉 -${gameState.bet} HC`;
  }
  else if (currentGame === 'mines') {
    body.innerHTML = `<div class="mines-grid mb-4">${[0,1,2,3,4,5,6,7,8].map(i => `<div class="mine-cell ${gameState.chosen == i ? (gameState.win > 0 ? 'gem' : 'bomb') : ''}">${gameState.chosen == i ? (gameState.win > 0 ? '💎' : '💥') : ''}</div>`).join('')}</div><button onclick="openGame('mines')" class="btn w-full py-2">Грати знову</button>`;
    res.innerHTML = gameState.win > 0 ? `🎉 +${gameState.win} HC` : `📉 -${gameState.bet} HC`;
  }
  else if (currentGame === 'rps') {
    const em = {rock: "✊", scissors: "✌️", paper: "✋"};
    body.innerHTML = `<div class="flex justify-around items-center mb-4 text-6xl"><div>${em[gameState.user_choice]}</div><div class="text-xl text-gray-500">vs</div><div>${em[gameState.bot_choice]}</div></div><button onclick="openGame('rps')" class="btn w-full py-2">Грати знову</button>`;
    res.innerHTML = gameState.win > gameState.bet ? `🎉 +${gameState.bet} HC` : (gameState.win === gameState.bet ? `🤝 Нічия` : `📉 -${gameState.bet} HC`);
  }
}

function closeGame() { document.getElementById('game-modal').classList.remove('show'); loadHome(); }
if (MY_ID) { document.getElementById('auth-modal').classList.remove('show'); loadHome(); }
</script>
</body>
</html>

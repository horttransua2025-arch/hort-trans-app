<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HORT TRANS</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
body { background: #0A192F; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 70px; overflow-x: hidden; }
.card { background: linear-gradient(145deg, #112240, #0A192F); border: 1px solid #1E3A8A; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
.btn { background: linear-gradient(90deg, #FFD700, #FFA500); color: #0A192F; font-weight: bold; border: none; cursor: pointer; transition: transform 0.1s; }
.btn:active { transform: scale(0.95); }
.btn-blue { background: linear-gradient(90deg, #00BFFF, #0057B7); color: #fff; font-weight: bold; border: none; cursor: pointer; }
.bottom-nav { background: rgba(17, 34, 64, 0.95); backdrop-filter: blur(10px); border-top: 1px solid #1E3A8A; position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
.nav-item { color: #8892B0; display: flex; flex-direction: column; align-items: center; font-size: 11px; flex: 1; cursor: pointer; }
.nav-item.active { color: #FFD700; text-shadow: 0 0 10px #FFD700; }
.nav-item i { font-size: 18px; margin-bottom: 2px; }
.page { display: none; } .page.active { display: block; animation: fadeIn .4s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(15px);} to {opacity:1; transform:translateY(0);} }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; z-index: 200; align-items: flex-end; backdrop-filter: blur(5px); }
.modal-overlay.show { display: flex; }
.modal-box { background: linear-gradient(180deg, #112240, #0A192F); width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 20px; border-top: 2px solid #00BFFF; }
input, select { background: #0A192F !important; border: 1px solid #1E3A8A !important; color: #fff !important; border-radius: 10px; padding: 12px; width: 100%; outline: none; }
.avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #FFD700; }
.playing-card { width: 55px; height: 80px; background: #fff; border-radius: 8px; color: #000; display: inline-flex; flex-direction: column; justify-content: space-between; padding: 5px; font-weight: bold; font-size: 18px; box-shadow: 0 4px 8px rgba(0,0,0,0.6); margin: 2px; cursor: pointer; transition: transform 0.2s; animation: dealCard 0.3s ease-out; }
@keyframes dealCard { from { transform: translateY(-50px) rotate(10deg); opacity: 0; } to { transform: translateY(0) rotate(0); opacity: 1; } }
.playing-card.red { color: #d32f2f; }
.playing-card.back { background: repeating-linear-gradient(45deg, #1E3A8A, #1E3A8A 5px, #0A192F 5px, #0A192F 10px); border: 2px solid #fff; }
.table-zone { position: relative; min-height: 200px; background: #0f4c3a; border: 4px solid #5c3a21; border-radius: 50% / 20%; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
</style>
</head>
<body class="p-4">

<div id="auth-modal" class="modal-overlay show">
  <div class="modal-box text-center">
    <h2 class="text-2xl font-bold text-yellow-400 mb-2">HORT TRANS</h2>
    <input type="text" id="auth-input" placeholder="Ваш нік TruckBook" class="mb-3" autocomplete="off">
    <button onclick="login()" class="btn w-full py-3 rounded-xl">Увійти</button>
    <div id="auth-error" class="mt-3 text-sm text-red-500"></div>
  </div>
</div>

<div id="page-home" class="page active">
  <h1 class="text-2xl font-bold text-center mb-3 text-yellow-400">Мій Профіль</h1>
  <div class="card p-5 mb-3">
    <div class="flex items-center gap-3 mb-4">
      <img id="my-avatar" class="avatar" src="">
      <div class="flex-1 min-w-0"><p class="font-bold truncate text-lg" id="my-name">Driver</p><p class="text-xs text-gray-400 truncate" id="my-nick">TruckBook: —</p></div>
      <button onclick="logout()" class="text-gray-400 text-xs px-3 py-2 border border-gray-700 rounded-lg bg-transparent">Змінити</button>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-blue-900/40 p-4 rounded-xl border border-blue-700"><p class="text-xs text-gray-400">Баланс</p><p class="text-2xl font-bold text-yellow-400" id="my-coins">0 HC</p></div>
      <div class="bg-blue-900/40 p-4 rounded-xl border border-blue-700"><p class="text-xs text-gray-400">Тижневий</p><p class="text-xl font-bold text-green-400" id="my-weekly">0</p></div>
    </div>
  </div>
</div>

<div id="page-lobby" class="page">
  <h1 class="text-2xl font-bold text-center mb-3 text-yellow-400">Грати</h1>
  <div class="card p-5 mb-3 text-center">
    <h3 class="font-bold mb-2">Створити кімнату</h3>
    <input type="number" id="lobby-bet" placeholder="Ставка HC" value="50" class="mb-3">
    <button onclick="createRoom()" class="btn-blue w-full py-3 rounded-xl mb-4">Створити</button>
    <hr class="border-gray-600 mb-4">
    <h3 class="font-bold mb-2">Або зайти за кодом</h3>
    <input type="number" id="join-code" placeholder="Код кімнати" class="mb-3">
    <button onclick="joinRoom()" class="btn w-full py-3 rounded-xl">Приєднатися</button>
  </div>
</div>

<div id="page-room" class="page">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold text-yellow-400" id="room-title">Кімната</h2>
    <button onclick="leaveRoom()" class="bg-red-600 text-white px-3 py-1 rounded">Вийти</button>
  </div>
  <div class="card p-5 mb-4">
    <h3 class="font-bold text-center mb-3">Гравці:</h3>
    <div id="room-players" class="grid grid-cols-2 gap-2"></div>
  </div>
  <button id="ready-btn" onclick="setReady()" class="btn w-full py-3 rounded-xl">Я готовий</button>
</div>

<div id="page-table" class="page">
  <div class="text-center mb-2 text-yellow-400 font-bold">Код: <span id="game-room-code"></span> | Козир: <span id="game-trump"></span></div>
  <div id="table-players" class="flex justify-center gap-4 mb-4"></div>
  <div class="table-zone mb-4" id="table-cards"></div>
  <div class="text-center"><p class="text-sm text-gray-400 mb-1">Ваші карти</p><div id="my-cards" class="flex flex-wrap justify-center"></div></div>
</div>

<div id="page-bank" class="page">
  <h1 class="text-2xl font-bold text-center mb-3 text-yellow-400">Банк</h1>
  <div class="card p-5">
    <input type="text" id="tr-recv" placeholder="Discord ID отримувача" class="mb-3">
    <input type="number" id="tr-amt" placeholder="Сума HC" class="mb-4">
    <button onclick="doTransfer()" class="btn w-full py-3 rounded-xl">Відправити</button>
    <div id="tr-result" class="mt-3 text-center font-bold text-green-400"></div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="switchPage('home',this)"><i class="fas fa-home"></i><span>Головна</span></div>
  <div class="nav-item" onclick="switchPage('lobby',this)"><i class="fas fa-gamepad"></i><span>Грати</span></div>
  <div class="nav-item" onclick="switchPage('bank',this)"><i class="fas fa-university"></i><span>Банк</span></div>
</div>

<script>
const API = "https://hort-backend.onrender.com"; // ВАШЕ ПОСИЛАННЯ НА RENDER
const WS_URL = "https://hort-backend.onrender.com"; // ВАШЕ WS ПОСИЛАННЯ
let MY_ID = localStorage.getItem("hort_uid");
let MY_NICK = localStorage.getItem("hort_nick");
let currentRoom = null;
let ws = null;

async function login() {
  const v = document.getElementById('auth-input').value.trim();
  try {
    const r = await fetch(`${API}/login`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ nick: v }) });
    const d = await r.json();
    if (r.ok) { MY_ID = String(d.user_id); MY_NICK = d.nick; localStorage.setItem('hort_uid', MY_ID); localStorage.setItem('hort_nick', MY_NICK); document.getElementById('auth-modal').classList.remove('show'); loadHome(); }
    else { document.getElementById('auth-error').textContent = d.detail; }
  } catch(e) { document.getElementById('auth-error').textContent = "Помилка з'єднання"; }
}
function logout() { localStorage.removeItem('hort_uid'); location.reload(); }

function switchPage(id, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active'); el.classList.add('active');
  if (id === 'home') loadHome();
}

async function loadHome() {
  if (!MY_ID) return;
  const p = await (await fetch(`${API}/profile/${MY_ID}`)).json();
  document.getElementById('my-avatar').src = p.avatar;
  document.getElementById('my-name').textContent = p.discord_name;
  document.getElementById('my-nick').textContent = 'TruckBook: ' + p.nickname;
  document.getElementById('my-coins').textContent = p.coins.toLocaleString() + ' HC';
  document.getElementById('my-weekly').textContent = p.weekly.toLocaleString();
}

async function createRoom() {
  const bet = parseInt(document.getElementById('lobby-bet').value);
  const r = await fetch(`${API}/create_room`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ host_uid: parseInt(MY_ID), bet: bet }) });
  const d = await r.json();
  currentRoom = d.room_id;
  joinRoomWS();
  document.getElementById('room-title').textContent = `Кімната ${currentRoom}`;
  switchPage('room', document.querySelectorAll('.nav-item')[1]);
}

function joinRoom() {
  currentRoom = document.getElementById('join-code').value;
  joinRoomWS();
  document.getElementById('room-title').textContent = `Кімната ${currentRoom}`;
  switchPage('room', document.querySelectorAll('.nav-item')[1]);
}

function joinRoomWS() {
  if (ws) ws.close();
  ws = new WebSocket(`${WS_URL}/${currentRoom}/${MY_ID}/${MY_NICK}`);
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'room_update') renderRoom(msg.players, msg.host);
    else if (msg.type === 'game_start') renderTable(msg);
  };
}

function renderRoom(players, host) {
  document.getElementById('room-players').innerHTML = players.map(p => `
    <div class="card p-2 flex items-center gap-2 ${p.id === host ? 'border-yellow-400' : ''}">
      <img src="${p.avatar}" class="w-8 h-8 rounded-full">
      <div><p class="text-sm font-bold">${p.nick}</p><p class="text-xs ${p.ready ? 'text-green-400' : 'text-gray-400'}">${p.ready ? 'Готовий' : 'Чекає'}</p></div>
    </div>
  `).join('');
}

function setReady() { if (ws) ws.send(JSON.stringify({ type: 'ready' })); }
function leaveRoom() { if (ws) ws.close(); switchPage('lobby', document.querySelectorAll('.nav-item')[1]); }

function renderTable(msg) {
  switchPage('table');
  document.getElementById('game-room-code').textContent = currentRoom;
  document.getElementById('game-trump').textContent = msg.trump;
  document.getElementById('table-players').innerHTML = msg.players.filter(p => p.id !== parseInt(MY_ID)).map(p => `
    <div class="text-center"><img src="${p.avatar}" class="w-10 h-10 mx-auto rounded-full border border-gray-600"><p class="text-xs mt-1">${p.nick} (${p.cards_count})</p></div>
  `).join('');
  document.getElementById('my-cards').innerHTML = msg.my_hand.map(c => `<div class="playing-card ${c.suit === '♥' || c.suit === '♦' ? 'red' : ''}"><span>${c.rank}<br>${c.suit}</span></div>`).join('');
}

async function doTransfer() {
  const res = document.getElementById('tr-result');
  const r = await fetch(`${API}/transfer`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ sender_id: parseInt(MY_ID), receiver_id: parseInt(document.getElementById('tr-recv').value), amount: parseInt(document.getElementById('tr-amt').value) }) });
  const d = await r.json();
  res.innerHTML = r.ok ? `<span class="text-green-400">${d.message}</span>` : `<span class="text-red-500">${d.detail}</span>`;
}

if (MY_ID) { document.getElementById('auth-modal').classList.remove('show'); loadHome(); }
</script>
</body>
</html>
